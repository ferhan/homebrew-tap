name: Audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: audit
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      # Taps this repository (at the PR merge commit) as ferhan/tap.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1

      - name: brew style
        run: brew style ferhan/tap

      - name: brew audit changed casks and formulae
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cd "$(brew --repo ferhan/tap)"
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          changed=$(git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD -- 'Casks/*.rb' 'Formula/*.rb')
          if [ -z "$changed" ]; then
            echo "No casks or formulae changed."
            exit 0
          fi
          for f in $changed; do
            name=$(basename "$f" .rb)
            case "$f" in
              Casks/*) kind=--cask ;;
              Formula/*) kind=--formula ;;
            esac
            echo "::group::brew audit $kind ferhan/tap/$name"
            brew audit "$kind" --strict --online "ferhan/tap/$name"
            echo "::endgroup::"
          done
